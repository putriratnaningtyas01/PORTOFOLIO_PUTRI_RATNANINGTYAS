<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F9FAFB" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="20" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="url(#goldGrad)" stroke-width="6" rx="16" />
  <!-- Inner Border -->
  <rect x="35" y="35" width="730" height="530" fill="none" stroke="#E5E7EB" stroke-width="2" rx="12" />
  
  <!-- Design Elements / Corners -->
  <path d="M35 80 L80 35 M35 120 L120 35" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M765 80 L720 35 M765 120 L680 35" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M35 520 L80 565 M35 480 L120 565" stroke="url(#goldGrad)" stroke-width="2" />
  <path d="M765 520 L720 565 M765 480 L680 565" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Seal Backdrop Ribbon -->
  <path d="M400 420 L380 520 L400 500 L420 520 Z" fill="#E5E7EB" opacity="0.8" />
  <path d="M400 420 L420 520 L440 500 L460 520 Z" fill="#D1D5DB" opacity="0.8" />

  <!-- Header -->
  <text x="400" y="100" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#6B7280" text-anchor="middle">CERTIFICATE OF COMPLETION</text>
  
  <text x="400" y="160" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="36" font-weight="700" fill="#111827" text-anchor="middle">Putri Ratnaningtyas</text>
  
  <!-- Divider -->
  <line x1="250" y1="200" x2="550" y2="200" stroke="url(#goldGrad)" stroke-width="2" />
  
  <!-- Certification Body -->
  <text x="400" y="240" font-family="'Inter', sans-serif" font-size="16" fill="#4B5563" text-anchor="middle">has successfully completed the professional development course and demonstrated</text>
  <text x="400" y="270" font-family="'Inter', sans-serif" font-size="16" fill="#4B5563" text-anchor="middle">competence in technical and organizational skill sets required for</text>
  <text x="400" y="310" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="22" font-weight="700" fill="url(#accentGrad)" text-anchor="middle">Information Systems Excellence</text>
  
  <!-- Issuer details -->
  <text x="400" y="370" font-family="'Inter', sans-serif" font-size="14" font-style="italic" fill="#6B7280" text-anchor="middle">Awarded for Academic and Organizational Accomplishments</text>
  
  <!-- Signatures and Seal -->
  <!-- Left Signature -->
  <line x1="150" y1="480" x2="300" y2="480" stroke="#9CA3AF" stroke-width="1" />
  <text x="225" y="470" font-family="'Courier New', monospace" font-size="16" font-style="italic" fill="#4B5563" text-anchor="middle">STT Terpadu Nurul Fikri</text>
  <text x="225" y="500" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#9CA3AF" text-anchor="middle">Academic Institution</text>
  
  <!-- Center Seal -->
  <circle cx="400" cy="450" r="35" fill="url(#goldGrad)" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.15))" />
  <circle cx="400" cy="450" r="28" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 2" />
  <text x="400" y="455" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">OFFICIAL</text>
  
  <!-- Right Signature -->
  <line x1="500" y1="480" x2="650" y2="480" stroke="#9CA3AF" stroke-width="1" />
  <text x="575" y="470" font-family="'Courier New', monospace" font-size="16" font-style="italic" fill="#4B5563" text-anchor="middle">HIMA Sistem Informasi</text>
  <text x="575" y="500" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#9CA3AF" text-anchor="middle">Organization Representative</text>
</svg>
